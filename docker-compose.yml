services:
  nginx:
    image: nginx:latest
    container_name: expense-tracker-nginx

    ports:
      - "80:80"

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - static_volume:/app/staticfiles:ro

    depends_on:
      - web
  web:
    container_name: expense-tracker-web
    build: .

    env_file:
      - .env

    expose:
      - "8000"

    volumes:
      - .:/app
      - static_volume:/app/staticfiles

    depends_on:
      - db

  db:
    image: postgres:18

    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}

    volumes:
      - db_data:/var/lib/postgresql

volumes:
  db_data:
  static_volume: