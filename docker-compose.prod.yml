services:

  nginx:
    image: nginx:latest

    ports:
      - "80:80"   # during production allowing expose of container port 80 to host machine no other port is needed as nginx will be the only entry point for the application

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - static_volume:/app/staticfiles:ro

    depends_on:
      - web


  web:
    build: .

    env_file:
      - .env

    expose:
      - "8000"

    volumes:
      - static_volume:/app/staticfiles

    depends_on:
      - db


  db:
    image: postgres:18

    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}

    volumes:
      - db_data:/var/lib/postgresql


volumes:
  db_data:
  static_volume: